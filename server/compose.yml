# Development LAN ThingsBoard stack (TASK-116).
#
# LAN-only topology per the production plan (section 9):
#
#   controller --------------------------> mqtts 8883 -> thingsboard (TB node)
#   (Wi-Fi LAN, verified TLS, access token)
#
#   admin browser --------------> https 443 -> caddy -> thingsboard (HTTP 9090)
#
# PostgreSQL and ThingsBoard state live in bind mounts under ./data
# (git-ignored), so data survives `docker compose down` and container
# recreation. TLS material is generated by scripts/gen_dev_tls.sh into
# ./certs (git-ignored) - nothing private is committed.
#
# Configuration comes from server/.env (git-ignored, generated from
# server/.env.example by scripts/gen_dev_tls.sh). Do not put secrets in
# server/.env.example.

name: hq-thingsboard-dev

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6}
    container_name: hq-tb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thingsboard}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in server/.env - run server/scripts/gen_dev_tls.sh}
    volumes:
      # Postgres 18+ images place data under a versioned subdirectory
      # (/var/lib/postgresql/18/docker); mount the parent, not the old
      # /var/lib/postgresql/data path (docker-library/postgres#1259).
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-thingsboard}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  thingsboard:
    image: ${TB_IMAGE:-thingsboard/tb-node:4.3.1.3}
    container_name: hq-tb
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TB_SERVICE_ID: tb-dev-node
      TB_QUEUE_TYPE: in-memory
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-thingsboard}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in server/.env - run server/scripts/gen_dev_tls.sh}
      # Admin HTTP API/UI - Caddy terminates TLS, so this stays plain HTTP
      # inside the Docker network. Loopback-only publication below.
      HTTP_BIND_ADDRESS: "0.0.0.0"
      HTTP_BIND_PORT: "9090"
      # Plaintext MQTT: development/loopback only. The LAN is served by the
      # verified TLS listener on 8883 (below), never by plaintext 1883.
      MQTT_ENABLED: "true"
      MQTT_BIND_ADDRESS: "127.0.0.1"
      MQTT_BIND_PORT: "1883"
      # MQTT TLS for the LAN, development CA, SAN DNS:home-assistance.local.
      MQTT_SSL_ENABLED: "true"
      MQTT_SSL_BIND_ADDRESS: "0.0.0.0"
      MQTT_SSL_BIND_PORT: "${TB_MQTT_TLS_PORT:-8883}"
      MQTT_SSL_PROTOCOL: TLSv1.2
      MQTT_SSL_CREDENTIALS_TYPE: PEM
      MQTT_SSL_PEM_CERT: /certs/server.pem
      MQTT_SSL_PEM_KEY: /certs/server_key.pem
      # Unused transports stay off in this minimal development stack.
      COAP_ENABLED: "false"
      LWM2M_ENABLED: "false"
    ports:
      - "${TB_MQTT_TLS_PORT:-8883}:8883" # LAN MQTT TLS (home-assistance.local:8883)
      - "127.0.0.1:1883:1883"            # dev-only plaintext MQTT, loopback
      - "127.0.0.1:9090:9090"            # direct admin UI/API, loopback
      - "127.0.0.1:7070:7070"            # edge/transport RPC, loopback
    volumes:
      # Named volumes (not ./data bind mounts): the image runs as the
      # unprivileged `thingsboard` user (uid 799), and Docker initializes
      # named-volume ownership from the image, so no host-side chown is
      # needed. They are durable across `docker compose down`/recreate.
      - tb-data:/data
      - tb-logs:/var/log/thingsboard
      - ./certs:/certs:ro
    healthcheck:
      # The embedded HTTP server answers as soon as the application is up;
      # bash's /dev/tcp probes the port without extra tooling in the image.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9090'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  caddy:
    # TLS reverse proxy: HTTPS 443 -> thingsboard:9090 (admin web UI/REST).
    image: ${CADDY_IMAGE:-caddy:2.9.1}
    container_name: hq-tb-caddy
    restart: unless-stopped
    depends_on:
      thingsboard:
        condition: service_started
    ports:
      - "${TB_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      # Caddy's admin API on 127.0.0.1:2019 is plain HTTP and returns the
      # loaded config (busybox wget ships with the alpine-based image).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  caddy-data:
    name: hq-tb-caddy-data
  caddy-config:
    name: hq-tb-caddy-config
  tb-data:
    name: hq-tb-data
  tb-logs:
    name: hq-tb-logs